<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0B0D">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RG3D - Sistema de Gestão</title>
  
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- Topbar com Identidade RG3D -->
  <header class="topbar">
    <div class="brand-container">
      <div class="brand-logo">RG<span>3D</span></div>
      <div class="subtitle">SUA IDEIA GANHA FORMA.</div>
    </div>
    <button class="icon-btn" id="backupBtn" title="Exportar Backup JSON">💾</button>
  </header>

  <!-- Conteúdo Dinâmico -->
  <main id="content"></main>

  <!-- Navegação Inferior -->
  <nav class="bottom-nav">
    <button data-page="dashboard" class="active">🏠<span>Início</span></button>
    <button data-page="clientes">👥<span>Clientes</span></button>
    <button data-page="orcamento">🧮<span>Orçamento</span></button>
    <button data-page="pedidos">📝<span>Pedidos/Vendas</span></button>
    <button data-page="materiais">🛠️<span>Materiais</span></button>
  </nav>
</div>

<script src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
