<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Giacometti Hub</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">⚡ GIACOMETTI HUB</div>
      <div class="subtitle">Gestão Multiempresa</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="driveBtn" onclick="window.initGoogleAuth()" title="Sincronizar Google Drive">☁️</button>
      <button class="icon-btn" id="backupBtn" title="Exportar Backup JSON">💾</button>
    </div>
  </header>

  <main id="content"></main>

  <nav class="bottom-nav" id="bottomNav" style="display:none;">
    <button data-page="dashboard" class="active">🏠<span>Início</span></button>
    <button data-page="clientes">👥<span>Clientes</span></button>
    <button data-page="produtos">📦<span>Produtos</span></button>
    <button data-page="venda">🛒<span>Vender</span></button>
    <button data-page="mais">☰<span>Mais</span></button>
  </nav>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
