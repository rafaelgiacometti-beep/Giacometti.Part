<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  
  <!-- Meta tags PWA atualizadas -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Caixa Pro</title>
  
  <!-- Ícone e PWA Manifest -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Biblioteca para os Gráficos (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="app">
  <!-- Barra Superior (Header Azul) -->
  <header class="topbar">
    <div>
      <div class="brand">💰 CAIXA PRO</div>
      <div class="subtitle">Vendas e controlo financeiro</div>
    </div>
    <button class="icon-btn" id="backupBtn" title="Exportar backup">💾</button>
  </header>

  <!-- Conteúdo Dinâmico (Renderizado pelo app.js) -->
  <main id="content"></main>

  <!-- Navegação Inferior (Bottom Nav) -->
  <nav class="bottom-nav">
    <button data-page="dashboard" class="active">🏠<span>Início</span></button>
    <button data-page="clientes">👥<span>Clientes</span></button>
    <button data-page="produtos">📦<span>Produtos</span></button>
    <button data-page="venda">🛒<span>Vender</span></button>
    <button data-page="mais">☰<span>Mais</span></button>
  </nav>
</div>

<!-- Modal Genérico para Avisos e Confirmações -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="modalClose" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<!-- Script Principal da Aplicação -->
<script src="app.js"></script>

<!-- Registo do Service Worker para PWA / Funcionalidade Offline -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registrado com sucesso!'))
        .catch(err => console.error('Erro ao registrar Service Worker:', err));
    });
  }
</script>

</body>
</html>
