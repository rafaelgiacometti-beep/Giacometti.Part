<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  
  <!-- Meta tags PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Giacometti Farm</title>
  
  <!-- Ícones e Manifest -->
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <!-- Estilos CSS -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Biblioteca de Gráficos Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div id="app">
  <!-- Barra Superior -->
  <header class="topbar">
    <div>
      <div class="brand">🚜 GIACOMETTI FARM</div>
      <div class="subtitle">Gestão & Controlo Financeiro</div>
    </div>
    <button class="icon-btn" id="backupBtn" title="Exportar backup">💾</button>
  </header>

  <!-- Conteúdo Dinâmico -->
  <main id="content"></main>

  <!-- Navegação Inferior -->
  <nav class="bottom-nav">
    <button data-page="dashboard" class="active">🏠<span>Início</span></button>
    <button data-page="clientes">👥<span>Clientes</span></button>
    <button data-page="produtos">📦<span>Produtos</span></button>
    <button data-page="venda">🛒<span>Vender</span></button>
    <button data-page="mais">☰<span>Mais</span></button>
  </nav>
</div>

<!-- Script Principal -->
<script src="app.js"></script>

<!-- Registo do Service Worker para PWA -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Service Worker registrado com sucesso!'))
        .catch(err => console.error('Erro ao registrar Service Worker:', err));
    });
  }
</script>

</body>
</html>
