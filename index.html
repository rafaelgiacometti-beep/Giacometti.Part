<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Caixa Pro</title>
  
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="brand">💰 CAIXA PRO</div>
      <div class="subtitle">Vendas e controlo financeiro</div>
    </div>
    <button class="icon-btn" id="backupBtn" title="Exportar backup">💾</button>
  </header>

  <main id="content"></main>

  <nav class="bottom-nav">
    <button data-page="dashboard" class="active">🏠<span>Início</span></button>
    <button data-page="clientes">👥<span>Clientes</span></button>
    <button data-page="produtos">📦<span>Produtos</span></button>
    <button data-page="venda">🛒<span>Vender</span></button>
    <button data-page="mais">☰<span>Mais</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button id="modalClose" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<input id="importInput" type="file" accept="application/json" hidden>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registrado com sucesso!'))
        .catch(err => console.error('Erro ao registrar SW:', err));
    });
  }
</script>
</body>
</html>
